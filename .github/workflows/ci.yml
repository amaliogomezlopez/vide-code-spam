name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "backend[dev]"
      - run: python -m ruff check backend
      - run: python -m mypy --config-file backend/pyproject.toml backend/app
      - run: python -m pytest backend/tests -q
      - if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm run electron:compile
      # Advisory: a transitive CVE in a build-only dependency should surface in
      # the log, not block every pull request in the repository.
      - working-directory: frontend
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Drives the real UI against a real backend and a real PTY: the only check
      # that proves a terminal actually spawns a process and streams it back.
      - working-directory: frontend
        run: npm run e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  packaged-backend:
    # Manual: PyInstaller downloads and bundles a multi-hundred-megabyte runtime,
    # which is too slow for every pull request but is the only way to catch the
    # hidden-import and DLL failures that only appear in the shipped executable.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m pip install -r backend/requirements.txt
      - run: .\scripts\build-backend-exe.ps1
        shell: pwsh
      - name: Smoke test the packaged backend
        shell: pwsh
        run: |
          $exe = "frontend/backend-dist/vibe-spam-backend.exe"
          if (-not (Test-Path $exe)) { throw "Backend executable was not produced at $exe" }
          $env:VIBE_SPAM_API_TOKEN = "ci-smoke-token"
          $process = Start-Process -FilePath $exe -ArgumentList "--port","8931" -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..60) {
              Start-Sleep -Seconds 2
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8931/api/health" -TimeoutSec 5
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw "Packaged backend never answered /api/health" }
            Write-Host "Packaged backend is healthy"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
